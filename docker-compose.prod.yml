# Production-only stack. Not for local dev — local dev runs bare metal on macOS.
#
# Spendula lives behind the host's existing Caddy instance, which reverse-proxies
# spendula.example.com → 127.0.0.1:8765 and handles Tailscale-integrated TLS.
# See docs/DEPLOY.md for the host Caddyfile snippet.
#
# Required on the host before `docker compose up -d`:
#   - .env           (Laravel env, including DB_HOST=db, DB_USERNAME, DB_PASSWORD)
#   - private.key    (Enable Banking RSA private key)
# Both are bind-mounted read-only into the app container; neither is baked into the image.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env
    volumes:
      # Secrets live on the host, never in the image. Read-only.
      - ./.env:/var/www/html/.env:ro
      - ./private.key:/var/www/html/storage/keys/enablebanking.key:ro
      # Persisted writable state.
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
      - app-framework:/var/www/html/storage/framework
    networks: [spendula]

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      # Loopback-only. Host Caddy is the sole reachability point.
      - "127.0.0.1:8765:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Serve static assets straight from the checked-out source tree on the host.
      - ./public:/var/www/html/public:ro
    networks: [spendula]

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # Read from the app's .env so the same credentials are shared.
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    env_file:
      - ./.env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [spendula]

networks:
  spendula:
    driver: bridge

volumes:
  db-data:
  app-storage:
  app-logs:
  app-framework:
